<app-modal-overlay>
  <div class="p-6 md:p-8">

    <h2 class="heading-l text-black dark:text-white mb-6">
      {{ mode() === 'edit' ? 'Edit Task' : 'Add New Task' }}
    </h2>

    <!-- Title -->
    <div class="flex flex-col gap-2 mb-6">
      <label class="heading-s text-medium-gray dark:text-white">Title</label>
      <div class="relative">
        <input
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event); titleError.set('')"
          placeholder="e.g. Take coffee break"
          class="w-full border rounded px-4 py-2 body-l bg-white dark:bg-dark-surface
                 text-black dark:text-white placeholder:text-medium-gray/40
                 outline-none focus:border-primary transition-colors"
          [class.border-destructive]="titleError()"
          [class.border-lines-light]="!titleError()"
        />
        @if (titleError()) {
          <span class="absolute right-4 top-1/2 -translate-y-1/2 body-l text-destructive">
            {{ titleError() }}
          </span>
        }
      </div>
    </div>

    <!-- Description -->
    <div class="flex flex-col gap-2 mb-6">
      <label class="heading-s text-medium-gray dark:text-white">Description</label>
      <textarea
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        placeholder="e.g. It's always good to take a break. This 15 minute break will recharge the batteries a little."
        rows="4"
        class="w-full border border-lines-light dark:border-dark-lines rounded px-4 py-2 body-l
               bg-white dark:bg-dark-surface text-black dark:text-white
               placeholder:text-medium-gray/40 outline-none focus:border-primary
               transition-colors resize-none"
      ></textarea>
    </div>

    <!-- Subtasks -->
    <div class="flex flex-col gap-3 mb-6">
      <label class="heading-s text-medium-gray dark:text-white">Subtasks</label>

      @for (sub of subtasks(); track sub.id) {
        <div class="flex items-center gap-4">
          <div class="relative flex-1">
            <input
              type="text"
              [ngModel]="sub.title"
              (ngModelChange)="updateSubtaskTitle(sub.id, $event)"
              placeholder="e.g. Make coffee"
              class="w-full border rounded px-4 py-2 body-l bg-white dark:bg-dark-surface
                     text-black dark:text-white placeholder:text-medium-gray/40
                     outline-none focus:border-primary transition-colors"
              [class.border-destructive]="sub.error"
              [class.border-lines-light]="!sub.error"
            />
            @if (sub.error) {
              <span class="absolute right-4 top-1/2 -translate-y-1/2 body-l text-destructive">
                {{ sub.error }}
              </span>
            }
          </div>
          <button
            type="button"
            (click)="removeSubtask(sub.id)"
            aria-label="Remove subtask"
            class="text-medium-gray hover:text-destructive transition-colors cursor-pointer shrink-0"
          >
            <img src="assets/icons/icon-cross.svg" alt="" class="w-[15px] h-[15px]">
          </button>
        </div>
      }

      <button
        type="button"
        (click)="addSubtask()"
        class="w-full py-2 rounded-full bg-primary/10 dark:bg-white text-primary heading-m
               hover:bg-primary/25 dark:hover:bg-white/80 transition-colors cursor-pointer"
      >
        + Add New Subtask
      </button>
    </div>

    <!-- Status -->
    <div class="mb-6">
      <app-dropdown
        label="Status"
        [options]="columnNames()"
        [selected]="status()"
        (selectedChange)="status.set($event)"
      />
    </div>

    <!-- Submit -->
    <button
      type="button"
      (click)="submit()"
      class="w-full py-[14px] rounded-full bg-primary hover:bg-primary-light
             text-white heading-m transition-colors cursor-pointer"
    >
      {{ mode() === 'edit' ? 'Save Changes' : 'Create Task' }}
    </button>

  </div>
</app-modal-overlay>
